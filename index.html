<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta
      name="description"
      content="Stell aus Pokémon eine Fußball-Startelf auf, lass sie nach Positions-Fit bewerten und spiel eine Saison. Schaffst du 34–0?"
    />
    <!-- Link-Vorschau (Messenger, soziale Netzwerke) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pokémon Elf" />
    <meta property="og:title" content="Pokémon Elf – Lineup Builder" />
    <meta
      property="og:description"
      content="Stell aus Pokémon eine Fußball-Startelf auf, lass sie nach Positions-Fit bewerten und spiel eine Saison. Schaffst du 34–0?"
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installierbar (PWA ohne Service Worker – nach einem Deploy gibt es nie eine veraltete Version) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pokémon Elf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pokémon Elf – Lineup Builder</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('pokemon-elf:settings') || '{}');
        // Ohne gespeicherte Wahl: helles Design, wenn das Gerät hell eingestellt ist
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
        // Browserleiste passend zum Design (wie später in Settings)
        if (document.documentElement.dataset.theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f6f9');
        if (s.lang) document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
